<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<title>
    Basic Calculator
</title>
 <link rel="stylesheet" href="cac.css">
</head>
<body>
    <div class="Calculator">
        <input type="text" id="display" readonly>
        <button onclick="diplay. value +='7'">7</button>
        <button onclick="diplay. value +='8'">8</button>
        <button onclick="diplay. value +='9'">9</button>
        <button onclick="diplay. value +='/'">/</button>
        <button onclick="diplay. value +='4'">4</button>
        <button onclick="diplay. value +='5'">5</button>
        <button onclick="diplay. value +='6'">6</button>
        <button onclick="diplay. value +='*'">*</button>
        <button onclick="diplay. value +='1'">1</button>
        <button onclick="diplay. value +='2'">2</button>
        <button onclick="diplay. value +='3'">3</button>
        <button onclick="diplay. value +='-'">-</button>
        <button onclick="diplay. value +='+'">+</button>
        <button onclick="diplay. value +='0'">0</button>
        <button onclick="diplay. value = eval(diplay. value)">=</button>
        <button onclick="diplay. value = ''">C</button>
    </div>

</body>
<script src="cac.js"></script>
</html>
